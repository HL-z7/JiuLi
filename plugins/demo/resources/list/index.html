<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f8fafc; padding: 20px; width: fit-content; }
    #container {
      width: 620px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }
    .title {
      padding: 18px 22px;
      font-size: 19px;
      font-weight: 700;
      color: #0f172a;
      background: linear-gradient(90deg, #eef2ff, #faf5ff);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title .count { font-size: 13px; font-weight: 400; color: #64748b; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 11px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #475569; font-weight: 600; font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #fcfdff; }
    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 12px;
      background: #eef2ff;
      color: #4f46e5;
    }
    .tag.warn { background: #fff7ed; color: #c2410c; }
    .tag.ok { background: #ecfdf5; color: #047857; }
    .foot { padding: 14px 22px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="container">
    <div class="title">
      <span>{{ title }}</span>
      <span class="count">共 {{ list.length }} 条 · {{ time }}</span>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width: 46px">#</th>
          {{ each columns col }}<th>{{ col }}</th>{{ /each }}
        </tr>
      </thead>
      <tbody>
        {{ each list item index }}
        <tr>
          <td>{{ index + 1 }}</td>
          <td>{{ item.name }}</td>
          <td><span class="tag {{ item.type }}">{{ item.state }}</span></td>
          <td>{{ item.value }}</td>
        </tr>
        {{ /each }}
      </tbody>
    </table>
    <div class="foot">渲染测试：表格 / 循环 / 条件样式 / 中文排版</div>
  </div>
</body>
</html>

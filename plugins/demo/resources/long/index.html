<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #0b1120; padding: 20px; width: fit-content; }
    #container { width: 600px; }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 10px;
      background: #111c33;
      color: #cbd5f5;
      font-size: 14px;
    }
    .row .idx {
      width: 34px;
      height: 24px;
      border-radius: 6px;
      background: #1e293b;
      color: #93c5fd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    .row .bar { flex: 1; height: 8px; border-radius: 999px; background: #1e293b; overflow: hidden; }
    .row .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #818cf8); }
    .head { color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 14px; }
    .head small { display: block; margin-top: 6px; font-size: 12px; font-weight: 400; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="container">
    <div class="head">
      长图分页测试
      <small>共 {{ rows.length }} 行 · 生成时间 {{ time }} · 高度超过 {{ pageHeight }}px 会自动分页</small>
    </div>
    {{ each rows item index }}
    <div class="row">
      <div class="idx">{{ index + 1 }}</div>
      <div>{{ item.label }}</div>
      <div class="bar"><i style="width: {{ item.percent }}%"></i></div>
      <div>{{ item.percent }}%</div>
    </div>
    {{ /each }}
  </div>
</body>
</html>

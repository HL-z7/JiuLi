# 默认设置
default:
  groupCD: 500   # 群聊中所有指令操作冷却时间，单位毫秒,0则无限制
  singleCD: 2000 # 群聊中个人操作冷却时间，单位毫秒

  onlyReplyAt: 0 # 是否只仅关注主动提及Bot的消息 0-否 1-是 2-非主人
  onlyReplyMaster: 0 # 是否只响应主人：0-否（所有人可用）1-只响应主人（其他消息静默忽略，也不回复无权限提示）
  botAlias:      # 开启后则只回复提及Bot的消息及特定前缀的消息
    - 玖璃

  addLimit: 0    # 是否限制添加消息 0-所有群员 1-群管理员 2-主人
  addPrivate: 1  # 是否允许私聊添加
  addReply: 1    # 是否回复触发消息
  addAt: 0       # 是否提及触发用户
  addRecall: 60  # 是否撤回回复消息

  enable:        # 只启用功能，配置后只有该功能才响应
  disable:       # 禁用功能，功能名称

# Bot单独设置
114514:default:
  onlyReplyAt: 1
  botAlias:
    - 玖璃

# 群单独设置
123456:
  groupCD: 500
  singleCD: 2000

# [Bot:群]单独设置
114514:123456:
  enable:
  disable:
